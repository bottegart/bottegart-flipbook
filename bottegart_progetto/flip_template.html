/* Impaginato: una pagina alla volta, come un catalogo editoriale; ogni fascia d’età ha il suo colore, preso dall’arcobaleno del logo Bottegart. */
:root{
  --bg:#eef0ee; --paper:#fbfbf9; --ink:#121a26; --mute:#5b6472; --line:#dde1e3; --soft:#f1f3f2;
  --brand:#1f8fd6; --brand-ink:#ffffff; --ok:#1d8a52; --band:#1f8fd6; --band-ink:#ffffff;

  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --shadow:0 1px 2px rgba(18,26,38,.06),0 12px 40px -12px rgba(18,26,38,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--paper:#151c25;--ink:#eef2f5;--mute:#9aa6b3;--line:#273241;--soft:#1c2531;--brand:#4fb0ee;--brand-ink:#08131d;--ok:#4cc488;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1218;--paper:#151c25;--ink:#eef2f5;--mute:#9aa6b3;--line:#273241;--soft:#1c2531;--brand:#4fb0ee;--brand-ink:#08131d;--ok:#4cc488;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-variation-settings:"opsz" 14;font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
em.s,.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left,0px)) 110px max(14px,env(safe-area-inset-right,0px))}
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:6}
.progress i{display:block;height:100%;width:0;background:var(--band);transition:width .35s ease,background .35s ease}

/* ---------- pagina e girata ---------- */
.stage{perspective:2000px}
.page{position:relative;background:var(--paper);border-radius:4px 18px 18px 4px;box-shadow:var(--shadow);padding:clamp(18px,3.4vw,44px);min-height:78vh;transform-origin:left center;overflow:hidden}
.page::before{content:"";position:absolute;inset:0 auto 0 0;width:18px;background:linear-gradient(90deg,rgba(18,26,38,.10),transparent);pointer-events:none}
.out-n{animation:outn .32s cubic-bezier(.5,0,.75,0) forwards}
.out-p{animation:outp .32s cubic-bezier(.5,0,.75,0) forwards}
.in-n{animation:inn .42s cubic-bezier(.2,.7,.2,1)}
.in-p{animation:inp .42s cubic-bezier(.2,.7,.2,1)}
@keyframes outn{to{transform:rotateY(-28deg) translateX(-4%);opacity:0;filter:brightness(.85)}}
@keyframes outp{to{transform:rotateY(18deg) translateX(6%);opacity:0}}
@keyframes inn{from{transform:translateX(5%);opacity:0}to{transform:none;opacity:1}}
@keyframes inp{from{transform:rotateY(-24deg) translateX(-4%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.out-n,.out-p,.in-n,.in-p{animation:none}}

/* ---------- copertina ---------- */
.cv{display:grid;gap:clamp(20px,4vw,48px);grid-template-columns:1fr;min-height:calc(78vh - 88px)}
@media (min-width:900px){.cv{grid-template-columns:1.05fr .95fr;align-items:stretch}}
.cv-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.cv-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cv-top img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)}
.cv-top span{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.cv h1{font-size:clamp(3.4rem,14vw,8.4rem);line-height:.86;font-weight:800;font-variation-settings:"opsz" 96;letter-spacing:-.045em;margin-top:auto}
.cv h1 em{display:block;font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em;color:var(--brand);font-size:1.12em;line-height:.9}
.verbs{display:flex;flex-wrap:wrap;gap:8px}
.verbs span{border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:600;font-size:.95rem}
.verbs span:nth-child(1){background:#ee4a5f;border-color:#ee4a5f;color:#fff}
.verbs span:nth-child(2){background:#f2b705;border-color:#f2b705;color:#121a26}
.verbs span:nth-child(3){background:#3dae5a;border-color:#3dae5a;color:#fff}
.verbs span:nth-child(4){background:#4a5fc1;border-color:#4a5fc1;color:#fff}
.lead{font-size:clamp(1rem,1.5vw,1.15rem);max-width:34em;margin:0;color:var(--mute)}
.lead b{color:var(--ink);font-weight:600}
.stats{display:flex;gap:clamp(18px,3vw,36px);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}

/* ---------- intestazione pagina ---------- */

.ph-head h2 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--band-text,var(--band));letter-spacing:-.01em}

/* ---------- schede libro ---------- */

.card{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--paper);min-width:0}
.cover{position:relative;align-self:start;width:118px;aspect-ratio:2/3;border-radius:3px 8px 8px 3px;overflow:hidden;box-shadow:0 10px 22px -10px rgba(0,0,0,.5),inset 3px 0 0 rgba(0,0,0,.12);color:var(--c-ink);background:var(--c);display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px;flex:none}
.cover .pt{font-family:var(--serif);font-size:1.32rem;line-height:1;letter-spacing:-.01em;word-break:break-word;hyphens:auto}

.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
.pub{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.info h3{font-size:1.18rem;line-height:1.15;font-weight:700;font-variation-settings:"opsz" 30}
.au{font-size:.88rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--soft);border:1px solid var(--line)}

.chip.caa{background:transparent;border-color:var(--brand);color:var(--brand)}
.syn{font-size:.92rem;line-height:1.5;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

.syn .tmp{color:var(--mute);font-style:italic}
.more{align-self:flex-start;background:none;border:0;padding:0;color:var(--mute);font-size:.8rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.det dt{font-weight:600;color:var(--ink)}.det dd{margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;flex-wrap:wrap}

.price.none{font-weight:500;font-size:.8rem;color:var(--mute)}
@media (max-width:420px){.card{grid-template-columns:1fr}.cover{width:104px}}

/* ---------- pulsanti ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:9px 16px;font-size:.88rem;font-weight:600;min-height:40px}
.btn.big{padding:13px 22px;font-size:1rem}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.added{background:var(--ok);color:#fff}
.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* ---------- indice ---------- */
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.idx button{width:100%;text-align:left;border:0;border-radius:14px;padding:18px 18px 16px;background:var(--b);color:var(--bi);display:flex;flex-direction:column;gap:18px;min-height:150px;transition:transform .15s ease}
.idx button:hover{transform:translateY(-2px)}
.idx .n{font-size:1.5rem;font-weight:800;line-height:1;letter-spacing:-.03em;font-variation-settings:"opsz" 60}
.idx .c{margin-top:auto;display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
.idx .wishtile{background:var(--ink);color:var(--paper)}
.note{font-size:.82rem;color:var(--mute);margin:20px 0 0;max-width:60em}
.posters{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.posters h3{font-size:1.1rem;flex-basis:100%}
.posters img{width:min(46%,200px);height:auto;border-radius:6px;box-shadow:var(--shadow)}

/* ---------- desiderata ---------- */
.form{display:grid;gap:14px;max-width:820px}
.form h3{font-size:1.2rem;margin-top:10px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mute);font-weight:500}
.form input,.form textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;gap:12px;grid-template-columns:1fr}@media (min-width:700px){.two{grid-template-columns:1fr 1fr}}
.wl{display:grid;gap:8px}
.wi{display:grid;grid-template-columns:1fr 74px;gap:6px 8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center}
.wi .t{font-weight:700}.wi input{width:100%}.wi .n{grid-column:1/3}
.wi .x{grid-column:2/3;grid-row:1/2;justify-self:end;background:none;border:0;color:#d23a4f;font-size:.82rem;font-weight:600}

.meta{color:var(--mute);font-weight:400;font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
textarea.out{min-height:200px;font-size:.88rem}

/* ---------- barra di navigazione ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:999px;display:flex;align-items:center;gap:2px;padding:5px;z-index:5;box-shadow:0 14px 40px -10px rgba(0,0,0,.5);max-width:calc(100% - 20px)}
.nav button{background:transparent;border:0;color:inherit;border-radius:999px;padding:9px 13px;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav button:hover:not(:disabled){background:rgba(255,255,255,.12)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .cnt{min-width:64px;text-align:center;font-size:.82rem;opacity:.75;font-variant-numeric:tabular-nums}
.badge{background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 7px;font-size:.74rem;min-width:20px;text-align:center}
@media (max-width:520px){.nav .lbl{display:none}.nav button{padding:9px 11px}}

/* ---------- ricerca ---------- */
.search{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:8;display:flex;justify-content:center;align-items:flex-start;padding:max(40px,env(safe-area-inset-top,0px)) 14px 14px}
.search .box{background:var(--paper);border-radius:18px;width:min(640px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.search input{border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:1.1rem;background:transparent;width:100%}
.search input:focus-visible{outline:none}
.search ul{list-style:none;margin:0;padding:6px;overflow:auto}
.search li button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px}
.search li button:hover,.search li button:focus-visible{background:var(--soft)}
.search .r1{font-weight:600}.search .r2{font-size:.8rem;color:var(--mute)}
.search .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}

@keyframes hl{0%,40%{box-shadow:0 0 0 3px var(--band)}100%{box-shadow:0 0 0 0 transparent}}
</style>

<!--
=====================  COME MODIFICARE QUESTO FILE  =====================
Apri questo file HTML con un editor di testo (TextEdit in modalità testo, VS Code…).
Cerca il blocco "DATI DEI LIBRI" qui sotto: ogni libro è su UNA riga.
- "fascia": decide in quale sezione/pagina compare il libro. Deve essere uno dei valori
  elencati in FASCE (puoi anche aggiungerne di nuovi: le pagine si creano da sole).
- "eta": testo mostrato sulla scheda (es. "5-7 anni").
- "prezzo": numero con il punto (es. 16.5) oppure null per "Prezzo su richiesta".
- "sinossi": il testo che leggono le insegnanti. Quando lo hai verificato metti "verificata": true.
- "isbn" e "copertina": la copertina si mostra se il libro ha una copertina incorporata (blocco "copertine") oppure, se COPERTINE_ONLINE è true, scaricandola da internet con l’ISBN.
  Per usare una tua immagine scrivi l’indirizzo (https://…) in "copertina".
- Per spostare un libro di età basta cambiare "fascia". Per cancellarlo togli la riga.
Mantieni le virgolette e la virgola alla fine di ogni riga (tranne l’ultima).
=========================================================================
-->
<script id="dati-modificabili">

// true = per i libri senza copertina incorporata prova a caricarla da internet (funziona solo se il file è ospitato/aperto fuori dall’anteprima Claude)

// ---------- DATI DEI LIBRI ----------

<script>
/* la copertina prende le proporzioni dell’immagine (gli albi quadrati non vengono tagliati) */
function fitCover(i){if(i.naturalWidth&&i.naturalHeight){var r=i.naturalWidth/i.naturalHeight;i.parentNode.style.aspectRatio=Math.min(1.25,Math.max(.55,r));}}
function nrmjs(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");}
var B=LIBRI.map(function(x,i){var emb=COPERTINE[x.isbn]||COPERTINE["t:"+nrmjs(x.titolo)]||"";return {id:i,t:x.titolo,a:x.autore,p:x.editore,f:x.fascia,s:x.sinossi,real:x.verificata,pr:x.prezzo,caa:x.caa,e:x.eta,g:x.tipo,c:x.collana,th:x.temi,acc:x.accessibilita,emb:!!(x.copertina||emb),img:(x.copertina||emb||((COPERTINE_ONLINE&&x.isbn)?"https://www.ibs.it/images/"+x.isbn+"_0_0_150_0_75.jpg":""))};});
B.forEach(function(b){if(FASCE.indexOf(b.f)<0)FASCE.push(b.f);});
/* colori delle fasce: l’arcobaleno del logo Bottegart. [sfondo, testo sopra lo sfondo, colore del testo su carta] */
var BANDS=[["#ee4a5f","#ffffff","#d9334a"],["#f07a2a","#ffffff","#d8621a"],["#f2b705","#121a26","#b98a00"],["#3dae5a","#ffffff","#2a9447"],["#1f9d8b","#ffffff","#16867a"],["#1f8fd6","#ffffff","#1f8fd6"],["#4a5fc1","#ffffff","#5568cf"],["#9b3fa0","#ffffff","#a548aa"],["#55606e","#ffffff","#6b7684"]];
function band(f){var i=FASCE.indexOf(f);return BANDS[Math.max(0,i)%BANDS.length];}
var P=[],AGES=[];
FASCE.forEach(function(f){var ids=[];B.forEach(function(b){if(b.f===f)ids.push(b.id);});if(!ids.length)return;
  var n=ids.length,k=Math.max(1,Math.floor(n/4)),base=Math.floor(n/k),extra=n%k,i=0;AGES.push({name:f,first:P.length,tot:n});
  for(var j=0;j<k;j++){var size=base+(j<extra?1:0);P.push({type:"books",age:f,ids:ids.slice(i,i+size)});i+=size;}});
var PAGES=[{type:"cover"},{type:"index"}].concat(P).concat([{type:"wish"}]);
var cur=0,wish={},custom=[],info={name:"",school:"",email:"",msg:""};
try{var sv=JSON.parse(localStorage.getItem("bottegart_wish")||"null");if(sv){wish=sv.wish||{};custom=sv.custom||[];info=sv.info||info;}}catch(e){}
function save(){try{localStorage.setItem("bottegart_wish",JSON.stringify({wish:wish,custom:custom,info:info}));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function money(v){return "€ "+v.toFixed(2).replace(".",",");}
function count(){var n=0;for(var k in wish)n++;return n+custom.length;}
function badge(){document.getElementById("badge").textContent=count();}
function setBand(f){var c=f?band(f):["#1f8fd6","#ffffff","#1f8fd6"],r=document.documentElement.style;r.setProperty("--band",c[0]);r.setProperty("--band-ink",c[1]);r.setProperty("--band-text",c[2]);}
function splitAge(name){var m=String(name).match(/^(.*?)\s*\((.*)\)\s*$/);return m?esc(m[1])+' <em>'+esc(m[2])+'</em>':esc(name);}

function card(b){
  var c=band(b.f);
  var cover='<div class="cover" style="--c:'+c[0]+';--c-ink:'+c[1]+'"><span class="pl"></span><span class="pt">'+esc(b.t)+'</span><span class="pp">'+esc(b.p)+'</span>'+(b.img?'<img class="cimg" src="'+esc(b.img)+'" alt="Copertina di '+esc(b.t)+'" loading="lazy" onload="fitCover(this)" onerror="this.remove()">':'')+'</div>';
  var price=b.pr!=null?'<span class="price">'+money(b.pr)+'</span>':'<span class="price none">Prezzo su richiesta</span>';
  var on=!!wish[b.id];
  var chips=(b.e?'<span class="chip age">'+esc(b.e)+'</span>':'')+(b.caa?'<span class="chip caa">CAA</span>':'')+(b.g&&b.g.length<34?'<span class="chip">'+esc(b.g)+'</span>':'');
  var det=(b.g?'<dt>Tipo</dt><dd>'+esc(b.g)+'</dd>':'')+(b.c?'<dt>Collana</dt><dd>'+esc(b.c)+'</dd>':'')+(b.th?'<dt>Temi</dt><dd>'+esc(b.th)+'</dd>':'')+(b.acc?'<dt>Accessibilità</dt><dd>'+esc(b.acc)+'</dd>':'');
  return '<article class="card" id="b'+b.id+'">'+cover+'<div class="info"><span class="pub">'+esc(b.p)+'</span><h3>'+esc(b.t)+'</h3><div class="au">'+(b.a?esc(b.a):"Autore da verificare")+'</div>'+
    (chips?'<div class="chips">'+chips+'</div>':'')+
    '<p class="syn">'+esc(b.s)+(b.real?'':' <span class="tmp">Scheda sintetica: trama completa in arrivo.</span>')+'</p>'+
    '<button class="more" data-more>Leggi tutto</button>'+(det?'<dl class="det">'+det+'</dl>':'')+
    '<div class="row">'+price+'<button class="btn'+(on?' added':'')+'" data-id="'+b.id+'">'+(on?'✓ Nella lista':'+ Desiderata')+'</button></div></div></article>';
}

function coverPage(){
  var pubs={},caa=0,withCov=[];B.forEach(function(b){pubs[b.p]=1;if(b.caa)caa++;if(b.emb)withCov.push(b);});
  var np=Object.keys(pubs).length;
  /* mosaico: una copertina per editore a giro, così si vedono tante case editrici diverse */
  var byP={},order=[];withCov.forEach(function(b){if(!byP[b.p]){byP[b.p]=[];order.push(b.p);}byP[b.p].push(b);});
  var pick=[],r=0;while(pick.length<16&&r<20){order.forEach(function(p){if(byP[p][r]&&pick.length<16)pick.push(byP[p][r]);});r++;}
  var cols=['','','',''];pick.forEach(function(b,i){cols[i%4]+='<img src="'+b.img+'" alt="">';});
  var stripe='';BANDS.slice(0,8).forEach(function(c){stripe+='<i style="background:'+c[0]+'"></i>';});
  return '<div class="cv"><div class="cv-l">'+
    '<div class="cv-top"><img src="'+IMG.bart+'" alt="Associazione Bottegart"><img src="'+IMG.sostare+'" alt="So’Stare, microeditoria del borgo consapevole"><span>Associazione Bottegart · So’Stare</span></div>'+
    '<h1>Libri per <em>crescere</em></h1>'+
    '<div class="verbs"><span>divertirsi</span><span>innamorarsi</span><span>comprendere</span><span>riflettere</span></div>'+
    '<p class="lead">Il catalogo per <b>insegnanti</b> di libri scelti da <b>case editrici indipendenti</b>, divisi per età, con tanti titoli in <b>CAA</b> e sui temi sociali. Scegli i libri con “+ Desiderata” e manda la tua lista a Bottegart dall’ultima pagina.</p>'+
    '<div class="stats"><div><b>'+B.length+'</b><span>libri</span></div><div><b>'+np+'</b><span>case editrici</span></div><div><b>'+caa+'</b><span>in CAA</span></div><div><b>'+AGES.length+'</b><span>fasce d’età</span></div></div>'+
    '<div class="cta"><button class="btn big brand" id="start">Sfoglia il catalogo →</button><button class="btn big alt" id="start2">Cerca un libro</button></div>'+
    '</div><div class="mosaic" aria-hidden="true"><div class="rail"><div class="col">'+cols.join('</div><div class="col">')+'</div></div><div class="stripe">'+stripe+'</div></div></div>';
}

function build(i){
  var p=PAGES[i];
  if(p.type==="cover")return coverPage();
  if(p.type==="index"){
    var h='<div class="ph-head"><div><div class="k"><i></i>Indice</div><h2>Scegli <em>l’età</em></h2></div><span class="pn">'+B.length+' libri</span></div><ul class="idx">';
    AGES.forEach(function(a){var c=band(a.name);h+='<li><button style="--b:'+c[0]+';--bi:'+c[1]+'" data-go="'+(a.first+2)+'"><span class="n">'+esc(a.name)+'</span><span class="c"><span>'+a.tot+' libri</span><span>pag. '+(a.first+3)+'</span></span></button></li>';});
    h+='<li><button class="wishtile" data-go="'+(PAGES.length-1)+'"><span class="n">La tua lista desiderata</span><span class="c"><span>da inviare a Bottegart</span><span>pag. '+PAGES.length+'</span></span></button></li></ul>';
    h+='<div class="posters"><h3>#ioleggoperché con Bottegart</h3><img src="'+IMG.p1+'" alt="Locandina #ioleggoperché: dona un libro a una scuola"><img src="'+IMG.p2+'" alt="Locandina #ioleggoperché: la nostra libreria è iscritta, gemellatevi con noi"></div>';
    return h;
  }
  if(p.type==="books"){
    var g='<div class="ph-head"><div><div class="k"><i></i>Fascia d’età</div><h2>'+splitAge(p.age)+'</h2></div><span class="pn">pagina '+(i+1)+' di '+PAGES.length+'</span></div><div class="grid">';
    p.ids.forEach(function(id){g+=card(B[id]);});
    return g+'</div>';
  }
  return wishPage();
}
function listHtml(){
  var h="";
  Object.keys(wish).forEach(function(id){var b=B[id],w=wish[id];if(!b)return;h+='<div class="wi"><div class="t">'+esc(b.t)+' <span class="meta">· '+esc(b.p)+'</span></div><button class="x" data-rm="'+id+'">Rimuovi</button><input class="n" data-note="'+id+'" placeholder="Nota (es. classe, quante copie per la biblioteca…)" value="'+esc(w.note||"")+'"><input class="q" type="number" min="1" data-qty="'+id+'" value="'+(w.qty||1)+'" aria-label="Copie"></div>';});
  custom.forEach(function(c,k){h+='<div class="wi"><div class="t">'+esc(c.title)+' <span class="meta">· '+esc(c.pub||"editore da indicare")+' · titolo aggiunto da te</span></div><button class="x" data-rmc="'+k+'">Rimuovi</button><input class="q" type="number" min="1" data-cq="'+k+'" value="'+(c.qty||1)+'" aria-label="Copie"></div>';});
  return h||'<p class="meta">Non hai ancora scelto nessun libro. Torna alle pagine e premi “+ Desiderata”, oppure aggiungi un titolo qui sotto.</p>';
}
function compose(){
  var L=["Gentile Bottegart,","","vorrei segnalarvi la mia lista di libri desiderati.",""];
  Object.keys(wish).forEach(function(id){var b=B[id],w=wish[id];if(!b)return;L.push("- "+b.t+" ("+(b.a||"autore n.d.")+", "+b.p+") × "+(w.qty||1)+(b.pr!=null?" – "+money(b.pr):"")+(w.note?" – nota: "+w.note:""));});
  custom.forEach(function(c){L.push("- "+c.title+" ("+(c.pub||"editore n.d.")+") × "+(c.qty||1)+" – titolo aggiunto da me");});
  if(!count())L.push("(nessun libro selezionato)");
  L.push("");if(info.msg)L.push(info.msg,"");
  L.push("Grazie e a presto,",(info.name||"[nome e cognome]"),(info.school||"[scuola / classe]"),(info.email||""));
  return L.join("\n");
}
function wishPage(){
  return '<div class="ph-head"><div><div class="k"><i></i>Ultima pagina</div><h2>La tua lista <em>desiderata</em></h2></div><span class="pn">modificabile prima dell’invio</span></div><div class="form">'+
  '<div class="two"><label>Nome e cognome<input id="f-name" value="'+esc(info.name)+'"></label><label>Scuola e classe<input id="f-school" value="'+esc(info.school)+'"></label></div>'+
  '<label>La tua email (per ricontattarti)<input id="f-email" type="email" value="'+esc(info.email)+'"></label>'+
  '<h3>Libri scelti</h3><div class="wl" id="wl">'+listHtml()+'</div>'+
  '<h3>Aggiungi un titolo non presente</h3><div class="two"><label>Titolo<input id="c-t"></label><label>Casa editrice (facoltativo)<input id="c-p"></label></div><div><button class="btn alt" id="c-add">+ Aggiungi alla lista</button></div>'+
  '<label>Messaggio per Bottegart (facoltativo)<textarea id="f-msg" rows="3">'+esc(info.msg)+'</textarea></label>'+
  '<h3>Testo dell’email (puoi modificarlo)</h3><textarea class="out" id="out">'+esc(compose())+'</textarea>'+
  '<div class="acts"><button class="btn brand" id="send">Invia a bottegart@gmail.com</button><button class="btn alt" id="copy">Copia il testo</button><button class="btn alt" id="clear">Svuota la lista</button></div>'+
  '<p class="note" id="sm">Il pulsante “Invia” apre il tuo programma di posta con il testo già pronto: devi premere Invia nella mail. Se non si apre, usa “Copia il testo” e scrivi a bottegart@gmail.com.</p></div>';
}
function refreshOut(){var o=document.getElementById("out");if(o){o.value=compose();}}
var busy=false;
function render(i,dir,focusId){
  var el=document.getElementById("page");
  function put(){
    var p=PAGES[i];setBand(p.type==="books"?p.age:null);
    el.innerHTML=build(i);el.className="page "+(dir?(dir>0?"in-n":"in-p"):"");cur=i;wire();busy=false;
    if(focusId!=null){var t=document.getElementById("b"+focusId);if(t){t.scrollIntoView({block:"center"});t.className+=" hl";}}else window.scrollTo(0,0);
    document.getElementById("cnt").textContent=(i+1)+" / "+PAGES.length;
    document.getElementById("prog").style.width=((i+1)/PAGES.length*100)+"%";
    document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===PAGES.length-1;badge();}
  if(dir&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){busy=true;el.className="page "+(dir>0?"out-n":"out-p");setTimeout(put,300);}else put();
}
function go(i,focusId){i=Math.max(0,Math.min(PAGES.length-1,i));if(busy)return;if(i===cur){if(focusId!=null)render(i,0,focusId);return;}render(i,i>cur?1:-1,focusId);}
function pageOf(id){for(var i=0;i<PAGES.length;i++){if(PAGES[i].ids&&PAGES[i].ids.indexOf(id)>=0)return i;}return 0;}
function wire(){
  var el=document.getElementById("page");
  el.querySelectorAll("[data-id]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-id");if(wish[id]){delete wish[id];b.className="btn";b.textContent="+ Desiderata";}else{wish[id]={qty:1,note:""};b.className="btn added";b.textContent="✓ Nella lista";}save();badge();};});
  el.querySelectorAll("[data-more]").forEach(function(b){var c=b.parentNode.parentNode;var s=c.querySelector(".syn");if(s.scrollHeight<=s.clientHeight+2&&!c.querySelector(".det")){b.remove();return;}b.onclick=function(){var o=c.classList.toggle("open");b.textContent=o?"Chiudi":"Leggi tutto";};});
  el.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(parseInt(b.getAttribute("data-go"),10));};});
  var s=document.getElementById("start");if(s)s.onclick=function(){go(1);};
  var s2=document.getElementById("start2");if(s2)s2.onclick=openSearch;
  if(PAGES[cur].type!=="wish")return;
  function bind(id,key){var f=document.getElementById(id);f.oninput=function(){info[key]=f.value;save();refreshOut();};}
  bind("f-name","name");bind("f-school","school");bind("f-email","email");bind("f-msg","msg");
  function rewire(){document.getElementById("wl").innerHTML=listHtml();wl();refreshOut();badge();}
  function wl(){
    document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){delete wish[b.getAttribute("data-rm")];save();rewire();};});
    document.querySelectorAll("[data-rmc]").forEach(function(b){b.onclick=function(){custom.splice(parseInt(b.getAttribute("data-rmc"),10),1);save();rewire();};});
    document.querySelectorAll("[data-qty]").forEach(function(f){f.oninput=function(){wish[f.getAttribute("data-qty")].qty=Math.max(1,parseInt(f.value,10)||1);save();refreshOut();};});
    document.querySelectorAll("[data-note]").forEach(function(f){f.oninput=function(){wish[f.getAttribute("data-note")].note=f.value;save();refreshOut();};});
    document.querySelectorAll("[data-cq]").forEach(function(f){f.oninput=function(){custom[parseInt(f.getAttribute("data-cq"),10)].qty=Math.max(1,parseInt(f.value,10)||1);save();refreshOut();};});
  }
  wl();
  document.getElementById("c-add").onclick=function(){var t=document.getElementById("c-t").value.trim();if(!t)return;custom.push({title:t,pub:document.getElementById("c-p").value.trim(),qty:1});document.getElementById("c-t").value="";document.getElementById("c-p").value="";save();rewire();};
  document.getElementById("clear").onclick=function(){wish={};custom=[];save();rewire();};
  document.getElementById("copy").onclick=function(){var t=document.getElementById("out"),sm=document.getElementById("sm");function done(){sm.className="note";sm.textContent="Testo copiato: incollalo in una mail a bottegart@gmail.com.";}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(done,function(){t.select();try{document.execCommand("copy");}catch(e){}done();});}else{t.select();try{document.execCommand("copy");}catch(e){}done();}};
  document.getElementById("send").onclick=function(){
    var body=document.getElementById("out").value;var subj="Lista desiderata libri"+(info.school?" – "+info.school:"");
    var url="mailto:bottegart@gmail.com?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
    var sm=document.getElementById("sm");
    if(url.length>1900){sm.className="note warn";sm.textContent="La lista è lunga: usa “Copia il testo” e incollala in una mail a bottegart@gmail.com.";return;}
    window.location.href=url;sm.textContent="Se la mail non si è aperta, usa “Copia il testo” e scrivi a bottegart@gmail.com.";
  };
}
/* ---------- ricerca ---------- */
var IDX=B.map(function(b){return nrmjs([b.t,b.a,b.p,b.th,b.g,b.c,b.caa?"caa simboli":""].join(" "));});
function openSearch(){var s=document.getElementById("search");s.hidden=false;var q=document.getElementById("q");q.value="";doSearch("");setTimeout(function(){q.focus();},30);}
function closeSearch(){document.getElementById("search").hidden=true;}
function doSearch(v){
  var words=String(v).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/\s+/).map(function(w){return w.replace(/[^a-z0-9]/g,"");}).filter(Boolean),h="",n=0;
  if(!words.length){document.getElementById("res").innerHTML='<li class="meta" style="padding:12px">Scrivi un titolo, un autore, un editore o un tema (es. “bullismo”, “CAA”, “ambiente”).</li>';return;}
  for(var i=0;i<B.length&&n<40;i++){var ok=words.every(function(w){return IDX[i].indexOf(w)>=0;});if(!ok)continue;n++;var b=B[i];
    h+='<li><button data-hit="'+b.id+'"><span class="dot" style="background:'+band(b.f)[0]+'"></span><span style="flex:1;min-width:0"><span class="r1">'+esc(b.t)+'</span><br><span class="r2">'+esc(b.a||"")+(b.a?" · ":"")+esc(b.p)+'</span></span><span class="r2">'+esc(b.f)+'</span></button></li>';}
  document.getElementById("res").innerHTML=h||'<li class="meta" style="padding:12px">Nessun libro trovato.</li>';
  document.querySelectorAll("[data-hit]").forEach(function(b){b.onclick=function(){var id=parseInt(b.getAttribute("data-hit"),10);closeSearch();go(pageOf(id),id);};});
}
document.getElementById("q").oninput=function(){doSearch(this.value);};
document.getElementById("search").onclick=function(e){if(e.target===this)closeSearch();};
document.getElementById("prev").onclick=function(){go(cur-1);};
document.getElementById("next").onclick=function(){go(cur+1);};
document.getElementById("goidx").onclick=function(){go(1);};
document.getElementById("gosearch").onclick=openSearch;
document.getElementById("gowish").onclick=function(){go(PAGES.length-1);};
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeSearch();return;}
  var t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;
  if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);
  if(e.key==="/"){e.preventDefault();openSearch();}
});
var tx=null,ty=null;
document.getElementById("page").addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById("page").addEventListener("touchend",function(e){if(tx==null)return;var d=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(d)>70&&Math.abs(d)>Math.abs(dy)*1.5&&PAGES[cur].type!=="wish"){go(d<0?cur+1:cur-1);}},{passive:true});
render(0,0);
</script>
</body>
</html>
